# النشر على Netlify (النسخة المرتبطة بـ Supabase). المتغيرات في إعدادات الموقع، لا في المستودع:
#   NEXT_PUBLIC_SUPABASE_URL و NEXT_PUBLIC_SUPABASE_ANON_KEY (عامة بطبيعتها)، و GEMINI_API_KEY (سرّي، للمساعد الذكي)
[build]
  command = "npm run build"
  # توفير حد الباقة المجانية: لا يُبنى الموقع إلا لتحديث رسالته فيها [deploy]
  # (تُجمع التحديثات وتُنشر مرة واحدة). خروج 0 = تخطي البناء، 1 = بناء.
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # النسخة المنشورة لا تأخذ نسخًا احتياطية محلية (قاعدة البيانات على Supabase)
  AUTO_BACKUP = "off"
