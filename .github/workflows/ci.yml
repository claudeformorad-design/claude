name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # المشروع يعتمد bun.lock لإدارة الحزم
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database tests (PostgreSQL 16 preinstalled on runner)
        run: npm run test:db
      - name: Database tests (embedded PGlite — same engine as local trial mode)
        run: npm run test:db:pglite
